[project]
objective = "Maximize the sum of radii of 26 non-overlapping circles packed in a unit square. Higher total radius sum = better packing."

# Uncomment to pass specific env vars through the scrub into evaluator
# and Claude Code subprocesses (e.g. GPU selection, cache dirs):
# passthrough_env = ["CUDA_VISIBLE_DEVICES", "MUJOCO_GL", "HF_HOME"]

[evaluator]
# Pin the interpreter and bring numpy/scipy so evaluation does not depend on
# the host python3.
command = "uv run --no-project --python 3.12 --with numpy --with scipy python3 evaluate.py"
# A candidate that modifies a protected file is rejected.
protected_files = ["evaluate.py"]

[dataset]
train_size = 1
val_size = 1

[evolution]
max_generations = 30
merge_enabled = false
perfect_score_threshold = 100.0
max_evaluations = 500

[agent]
backend = "claude"
model = "haiku"
effort = "low"
max_turns = 20
background = """
Circle packing: pack 26 non-overlapping circles in the unit square [0,1]x[0,1].
Each circle is (x, y, r) and must lie inside the square: r <= x, r <= y, r <= 1-x, r <= 1-y.
No two circles may overlap: dist(c_i, c_j) >= r_i + r_j.
Both rules are checked with an absolute tolerance of 1e-6. An invalid packing scores 0.
Score of a valid packing: let s = max(0, largest containment excess, largest pairwise overlap / 2); the score is the sum over circles of max(0, r - s). Higher is better.
solve.py must define pack_circles(n) returning a list of n (x, y, r) tuples; evaluate.py calls pack_circles(26).
The evaluator runs Python 3.12 with numpy and scipy installed.
"""
