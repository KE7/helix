[project]
objective = """Maximize the accuracy of solve(question) in agent.py on software engineering \
questions whose answers change over time, such as current library versions, API behaviors, \
and language feature changes."""

# The seed agent calls the Anthropic API. HELIX scrubs the environment of
# evaluator and agent subprocesses; variables listed here are passed through
# to both. The claude mutation backend also receives ANTHROPIC_API_KEY when it
# is set, so mutation sessions authenticate with this API key.
passthrough_env = ["ANTHROPIC_API_KEY"]

[evaluator]
# Pin the interpreter and bring the anthropic SDK so evaluation does not
# depend on the host python3.
command = "uv run --no-project --python 3.12 --with anthropic python evaluate.py"
# A candidate that modifies a protected file is rejected.
protected_files = ["evaluate.py", "train", "val"]

[dataset]
train_size = 5
val_size = 5

[evolution]
max_generations = 2
merge_enabled = true
num_parallel_proposals = 8

[agent]
backend = "claude"
model = "haiku"
effort = "low"
max_turns = 20
background = """
Task: agent.py defines solve(question: str) -> str. It receives one software
engineering question and returns only the answer string, for example a version
number, an HTTP status code, or a module name.

Evaluation: the evaluator imports agent.solve and calls it on each question in
the requested batch. Each answer is compared with the expected value by
normalized exact match. For version questions, an answer also matches when it
gives at least major.minor and those components equal the leading components of
the current version (for a current version of 3.13.4, "3.13" and "3.13.4" match;
"3" does not). A match scores 1.0 and anything else 0.0. Expected values for
version questions are resolved when the evaluator runs.

Environment: the evaluator runs Python 3.12 with the standard library and the
anthropic SDK installed, network access, and ANTHROPIC_API_KEY set.

Change agent.py and add new files as needed.
"""

[sandbox]
# Mutation agents run in Docker workspace copies that leave out the evaluator
# and its question files. Evaluation runs on the host in the candidate worktree.
enabled = true
omit_from_agent = ["evaluate.py", "train", "val"]
