[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "helix-evo"
version = "0.2.1"
description = "Hierarchical Evolution via LLM-Informed eXploration"
readme = "README.md"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [
    {name = "Karim Elmaaroufi"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "click>=8.1",
    "rich>=13.0",
    "gitpython>=3.1",
    "pydantic>=2.0",
    "pathspec>=0.12",
]

[project.urls]
Homepage = "https://github.com/KE7/helix"
Documentation = "https://ke7.github.io/helix/"
Repository = "https://github.com/KE7/helix"
Issues = "https://github.com/KE7/helix/issues"
Author = "https://github.com/KE7"

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.12",
    "pytest-cov>=5.0",
    "mypy>=1.10",
    "ruff>=0.4",
    # examples/circle_packing tests run its numpy-based fitness function
    "numpy>=1.26",
]

[project.scripts]
helix = "helix.cli:cli"

[tool.hatch.build.targets.wheel]
packages = ["src/helix"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/helix",
    "/pyproject.toml",
    "/uv.lock",
    "/README.md",
    "/LICENSE",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/.DS_Store",
    "**/.helix",
]

[dependency-groups]
dev = [
    "mypy>=1.20.0",
    "pytest-timeout>=2.4.0",
]
# Builds the docs site: uv run --group docs mkdocs serve
docs = [
    "mkdocs-material==9.7.6",
    # MkDocs 2.0 drops the plugin and theme system Material is built on.
    "mkdocs>=1.6,<2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Per-test 60s cap with thread-based timeout: kills any hanging test and
# prints a stack trace at kill, so future hangs surface in seconds locally
# instead of hours of CI runner time.  See commit 0f13530 for the precedent
# (a now-fixed NB-2-style infinite loop that wedged CI for 24 minutes).
timeout = 60
timeout_method = "thread"
markers = [
    "diff_harness: differential-testing harness (phases 2-4)",
]
