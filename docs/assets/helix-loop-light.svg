<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1048 372" width="1048" height="372" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-labelledby="t d">
  <title id="t">The HELIX search loop</title>
  <desc id="d">A parent repository is picked from the instance-level Pareto frontier. A coding agent edits a copy of it in its own git worktree over many turns. The child is scored against its parent on a training minibatch; a worse child is discarded, a better one is scored on the full validation set and joins the frontier. Both scoring steps use a protected evaluator the agent cannot modify.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#59636e"/>
    </marker>
    <marker id="arrow-accent" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#0a7d93"/>
    </marker>
  </defs>

  <!-- Seed -->
  <rect x="84" y="14" width="120" height="30" rx="15" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="144" y="34" text-anchor="middle" font-size="13" fill="#1f2328">your repo (seed)</text>
  <line x1="144" y1="44" x2="144" y2="76" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pareto frontier: candidates x instances, best per instance highlighted -->
  <rect x="24" y="80" width="240" height="210" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="40" y="106" font-size="15" font-weight="600" fill="#1f2328">Pareto frontier</text>
  <text x="40" y="124" font-size="12" fill="#59636e">each candidate is a git worktree</text>
  <g font-size="11" fill="#59636e">
    <text x="40" y="160">seed</text>
    <text x="40" y="190">g3-m1</text>
    <text x="40" y="220">g7-m2</text>
  </g>
  <g>
    <!-- columns: instances 1..6; rows: candidates -->
    <rect x="96"  y="146" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="122" y="146" width="22" height="20" rx="3" fill="#0a7d93"/>
    <rect x="148" y="146" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="174" y="146" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="200" y="146" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="226" y="146" width="22" height="20" rx="3" fill="#e6eaef"/>

    <rect x="96"  y="176" width="22" height="20" rx="3" fill="#0a7d93"/>
    <rect x="122" y="176" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="148" y="176" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="174" y="176" width="22" height="20" rx="3" fill="#0a7d93"/>
    <rect x="200" y="176" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="226" y="176" width="22" height="20" rx="3" fill="#e6eaef"/>

    <rect x="96"  y="206" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="122" y="206" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="148" y="206" width="22" height="20" rx="3" fill="#0a7d93"/>
    <rect x="174" y="206" width="22" height="20" rx="3" fill="#e6eaef"/>
    <rect x="200" y="206" width="22" height="20" rx="3" fill="#0a7d93"/>
    <rect x="226" y="206" width="22" height="20" rx="3" fill="#0a7d93"/>
  </g>
  <text x="172" y="246" text-anchor="middle" font-size="11" fill="#59636e">validation instances</text>
  <text x="40" y="272" font-size="12" fill="#1f2328">A candidate stays if it is the best</text>
  <text x="40" y="287" font-size="12" fill="#1f2328">on at least one instance.</text>

  <!-- Protected evaluator -->
  <rect x="718" y="14" width="306" height="46" rx="10" fill="#f3ecfa" stroke="#6f3aa0" stroke-dasharray="5 4"/>
  <text x="871" y="34" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">Protected evaluator</text>
  <text x="871" y="51" text-anchor="middle" font-size="11.5" fill="#59636e">your scoring code, hashed so an edited copy is caught</text>
  <line x1="788" y1="60" x2="788" y2="96" stroke="#6f3aa0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <line x1="959" y1="60" x2="959" y2="96" stroke="#6f3aa0" stroke-width="1.5" stroke-dasharray="4 3"/>

  <!-- 1 Select -->
  <rect x="300" y="96" width="150" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="316" y="122" font-size="15" font-weight="600" fill="#1f2328">1  Pick a parent</text>
  <text x="316" y="146" font-size="12" fill="#59636e">sampled from the</text>
  <text x="316" y="162" font-size="12" fill="#59636e">frontier, weighted by</text>
  <text x="316" y="178" font-size="12" fill="#59636e">instance wins</text>
  <line x1="264" y1="148" x2="296" y2="148" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- 2 Mutate (the coding agent) -->
  <rect x="486" y="96" width="196" height="104" rx="10" fill="#fbe8fa" stroke="#a3239f" stroke-width="2"/>
  <text x="502" y="122" font-size="15" font-weight="600" fill="#1f2328">2  A coding agent edits</text>
  <text x="502" y="146" font-size="12" fill="#1f2328">the whole repo, over many</text>
  <text x="502" y="162" font-size="12" fill="#1f2328">turns, in its own worktree:</text>
  <text x="502" y="182" font-size="12" font-weight="600" fill="#a3239f">read · edit · run · revise</text>
  <line x1="450" y1="148" x2="482" y2="148" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="584" y="222" text-anchor="middle" font-size="11.5" fill="#59636e">it sees the parent's per-instance</text>
  <text x="584" y="237" text-anchor="middle" font-size="11.5" fill="#59636e">scores and evaluator feedback</text>

  <!-- 3 Gate -->
  <rect x="718" y="96" width="140" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="734" y="122" font-size="15" font-weight="600" fill="#1f2328">3  Gate</text>
  <text x="734" y="146" font-size="12" fill="#59636e">child vs parent on</text>
  <text x="734" y="162" font-size="12" fill="#59636e">a training</text>
  <text x="734" y="178" font-size="12" fill="#59636e">minibatch</text>
  <line x1="682" y1="148" x2="714" y2="148" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="788" y1="200" x2="788" y2="232" stroke="#59636e" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="788" y="250" text-anchor="middle" font-size="12" fill="#59636e">not better: discarded</text>

  <!-- 4 Validate -->
  <rect x="894" y="96" width="130" height="104" rx="10" fill="#f6f8fa" stroke="#d1d9e0"/>
  <text x="910" y="122" font-size="15" font-weight="600" fill="#1f2328">4  Validate</text>
  <text x="910" y="146" font-size="12" fill="#59636e">score every</text>
  <text x="910" y="162" font-size="12" fill="#59636e">validation</text>
  <text x="910" y="178" font-size="12" fill="#59636e">instance</text>
  <line x1="858" y1="148" x2="890" y2="148" stroke="#0a7d93" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="876" y="140" text-anchor="middle" font-size="11" fill="#0a7d93">better</text>

  <!-- Return to the frontier -->
  <path d="M959 200 V330 H144 V294" fill="none" stroke="#0a7d93" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
  <text x="552" y="352" text-anchor="middle" font-size="12.5" fill="#1f2328">the child joins the frontier if it is the best on some instance; repeat until the budget runs out</text>
</svg>
