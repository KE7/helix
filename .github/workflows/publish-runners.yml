name: Refresh Runner Images

on:
  schedule:
    - cron: "17 07 * * *"
  workflow_dispatch:
    inputs:
      operation:
        description: Refresh upstream CLIs or roll back one convenience tag
        required: true
        default: refresh
        type: choice
        options:
          - refresh
          - rollback
      backend:
        description: Backend for rollback
        required: false
        type: choice
        options:
          - claude
          - codex
          - cursor
          - gemini
          - opencode
      target_digest:
        description: Existing multi-arch sha256 digest for rollback
        required: false
        type: string

concurrency:
  group: runner-image-refresh-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/ke7/helix-evo-runner
  CATALOG: docker/runner-versions.json
  EVIDENCE_RETENTION_DAYS: 90
  # gh expects [host/]owner/repo/path, not an https:// URL.
  ATTESTATION_SIGNER_WORKFLOW: KE7/helix/.github/workflows/publish-runners.yml
  ATTESTATION_SOURCE_REF: refs/heads/main

jobs:
  guard:
    name: Authorize protected release context
    if: >-
      ${{
        github.repository == 'KE7/helix' &&
        github.event.repository.default_branch == 'main' &&
        github.ref == 'refs/heads/main' &&
        (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Confirm the protected repository and default branch
        env:
          EXPECTED_REPOSITORY: KE7/helix
          EXPECTED_REF: refs/heads/main
          ACTUAL_REPOSITORY: ${{ github.repository }}
          ACTUAL_REF: ${{ github.ref }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$ACTUAL_REPOSITORY" == "$EXPECTED_REPOSITORY" ]]
          [[ "$ACTUAL_REF" == "$EXPECTED_REF" ]]

  resolve:
    name: Resolve changed upstream CLIs
    needs: guard
    if: >-
      ${{
        needs.guard.result == 'success' &&
        (github.event_name != 'workflow_dispatch' || inputs.operation == 'refresh')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      attestations: read
    outputs:
      base_changed: ${{ steps.plan.outputs.base_changed }}
      base_digest: ${{ steps.plan.outputs.base_digest }}
      base_tag: ${{ steps.plan.outputs.base_tag }}
      changed: ${{ steps.plan.outputs.changed }}
      builds: ${{ steps.plan.outputs.builds }}
      promotions: ${{ steps.plan.outputs.promotions }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Validate checked-in source policy
        run: python tools/runner_images.py validate --catalog "$CATALOG"

      - name: Resolve authoritative upstream versions and checksums
        run: >-
          python tools/runner_images.py discover
          --catalog "$CATALOG"
          --cursor-checksums
          --output /tmp/resolved-runner-versions.json

      - name: Log in to GHCR read-only
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Trust only attested, two-platform immutable releases
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          base_tag="$(jq -r '.base.immutable_tag' /tmp/resolved-runner-versions.json)"
          base_repository="${IMAGE_PREFIX}-base"
          base_image="${base_repository}:${base_tag}"
          base_digest=""
          base_state="$(python tools/runner_images.py inspect-ghcr-tag \
            --image "$base_repository" --tag "$base_tag")"
          if [[ "$base_state" != "absent" ]]; then
            docker buildx imagetools inspect "$base_image" \
              --format '{{json .Manifest}}' > /tmp/base-manifest.json
            python tools/runner_images.py verify-platforms \
              --input /tmp/base-manifest.json
            base_digest="$(jq -r '.digest' /tmp/base-manifest.json)"
            [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
            [[ "$base_digest" == "$base_state" ]]
            gh attestation verify \
              "oci://${IMAGE_PREFIX}-base@${base_digest}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
              --source-ref "$ATTESTATION_SOURCE_REF" \
              --deny-self-hosted-runners
            base_changed=false
          else
            base_changed=true
          fi

          printf '{}\n' > /tmp/published.json
          printf '[]\n' > /tmp/promotions.json
          for backend in claude codex cursor gemini opencode; do
            version="$(jq -r --arg backend "$backend" '.backends[$backend].version' /tmp/resolved-runner-versions.json)"
            promotion_guard_tag="$(jq -r --arg backend "$backend" '.backends[$backend].promotion_guard_immutable_tag // ""' /tmp/resolved-runner-versions.json)"
            tag="$(python tools/runner_images.py image-tag \
              --catalog /tmp/resolved-runner-versions.json \
              --backend "$backend")"
            repository="${IMAGE_PREFIX}-${backend}"
            image="${repository}:${tag}"
            state="$(python tools/runner_images.py inspect-ghcr-tag \
              --image "$repository" --tag "$tag")"
            if [[ "$state" != "absent" ]]; then
              docker buildx imagetools inspect "$image" \
                --format '{{json .Manifest}}' > "/tmp/${backend}-manifest.json"
              python tools/runner_images.py verify-platforms \
                --input "/tmp/${backend}-manifest.json"
              digest="$(jq -r '.digest' "/tmp/${backend}-manifest.json")"
              [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
              [[ "$digest" == "$state" ]]
              gh attestation verify "oci://${IMAGE_PREFIX}-${backend}@${digest}" \
                --repo "$GITHUB_REPOSITORY" \
                --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
                --source-ref "$ATTESTATION_SOURCE_REF" \
                --deny-self-hosted-runners
              jq --arg backend "$backend" --arg tag "$tag" \
                '.[$backend] = $tag' /tmp/published.json \
                > /tmp/published.next.json
              mv /tmp/published.next.json /tmp/published.json
              if [[ -n "$promotion_guard_tag" ]] && \
                [[ "$tag" == "$promotion_guard_tag" ]]; then
                latest_state="$(python tools/runner_images.py inspect-ghcr-tag \
                  --image "$repository" --tag latest)"
                if [[ "$latest_state" != "absent" ]]; then
                  latest_digest="$(docker buildx imagetools inspect \
                    "${repository}:latest" \
                    --format '{{json .Manifest}}' | jq -r '.digest')"
                  [[ "$latest_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
                  [[ "$latest_digest" == "$latest_state" ]]
                  if [[ "$latest_digest" != "$digest" ]]; then
                    jq \
                      --arg name "$backend" \
                      --arg version "$version" \
                      --arg immutable_tag "$tag" \
                      --arg target_digest "$digest" \
                      '. + [{
                        name:$name,
                        version:$version,
                        immutable_tag:$immutable_tag,
                        target_digest:$target_digest,
                        promotion_approved:true
                      }]' /tmp/promotions.json > /tmp/promotions.next.json
                    mv /tmp/promotions.next.json /tmp/promotions.json
                  fi
                fi
              fi
            fi
          done
          python tools/runner_images.py plan \
            --resolved /tmp/resolved-runner-versions.json \
            --published /tmp/published.json \
            --output /tmp/runner-plan.json
          echo "base_changed=${base_changed}" >> "$GITHUB_OUTPUT"
          echo "base_digest=${base_digest}" >> "$GITHUB_OUTPUT"
          echo "base_tag=${base_tag}" >> "$GITHUB_OUTPUT"
          echo "changed=$(jq -c '.changed' /tmp/runner-plan.json)" >> "$GITHUB_OUTPUT"
          echo "builds=$(jq -c '.builds' /tmp/runner-plan.json)" >> "$GITHUB_OUTPUT"
          echo "promotions=$(jq -c . /tmp/promotions.json)" >> "$GITHUB_OUTPUT"
          jq . /tmp/runner-plan.json >> "$GITHUB_STEP_SUMMARY"
          jq . /tmp/promotions.json >> "$GITHUB_STEP_SUMMARY"

      - name: Retain the exact resolved build plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolved-runner-plan-${{ github.run_attempt }}
          path: |
            /tmp/resolved-runner-versions.json
            /tmp/published.json
            /tmp/runner-plan.json
            /tmp/promotions.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

  build-base:
    name: Build base (${{ matrix.arch }})
    needs: [guard, resolve]
    if: ${{ needs.resolve.outputs.base_changed == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolved-runner-plan-${{ github.run_attempt }}
          path: /tmp/plan
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize exact base arguments
        id: args
        shell: bash
        run: |
          {
            echo 'value<<HELIX_ARGS'
            echo "NODE_BASE=$(jq -r '.base.node_image' /tmp/plan/resolved-runner-versions.json)"
            echo "DEBIAN_SNAPSHOT=$(jq -r '.base.debian_snapshot' /tmp/plan/resolved-runner-versions.json)"
            echo "UV_VERSION=$(jq -r '.base.uv_version' /tmp/plan/resolved-runner-versions.json)"
            echo "UV_AMD64_WHEEL=$(jq -r '.base.uv_wheels.amd64.url' /tmp/plan/resolved-runner-versions.json)"
            echo "UV_AMD64_SHA256=$(jq -r '.base.uv_wheels.amd64.sha256' /tmp/plan/resolved-runner-versions.json)"
            echo "UV_ARM64_WHEEL=$(jq -r '.base.uv_wheels.arm64.url' /tmp/plan/resolved-runner-versions.json)"
            echo "UV_ARM64_SHA256=$(jq -r '.base.uv_wheels.arm64.sha256' /tmp/plan/resolved-runner-versions.json)"
            echo HELIX_ARGS
          } >> "$GITHUB_OUTPUT"

      - name: Build base by untagged digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: docker/base.Dockerfile
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.value }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-base,push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Smoke the exact base digest before tagging
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          image="${IMAGE_PREFIX}-base@${digest}"
          docker pull "$image"
          command="$(jq -r '.base.smoke_command' /tmp/plan/resolved-runner-versions.json)"
          docker run --rm --network none --read-only --tmpfs /tmp "$image" sh -lc "$command"
          mkdir -p /tmp/digests
          touch "/tmp/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-base-${{ matrix.arch }}-${{ github.run_attempt }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

  merge-base:
    name: Validate and publish immutable base manifest
    needs: [guard, resolve, build-base]
    if: ${{ needs.resolve.outputs.base_changed == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    outputs:
      digest: ${{ steps.manifest.outputs.digest }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/digests
          pattern: digests-base-*-${{ github.run_attempt }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create candidate and validate platform parity
        id: manifest
        working-directory: /tmp/digests
        shell: bash
        run: |
          set -euo pipefail
          candidate="${IMAGE_PREFIX}-base:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -t digest_files < <(
            find . -maxdepth 1 -type f -printf '%f\n' | sort
          )
          [[ "${#digest_files[@]}" -eq 2 ]]
          digest_refs=()
          for digest in "${digest_files[@]}"; do
            [[ "$digest" =~ ^[0-9a-f]{64}$ ]]
            digest_refs+=("${IMAGE_PREFIX}-base@sha256:${digest}")
          done
          docker buildx imagetools create -t "$candidate" "${digest_refs[@]}"
          candidate_digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r '.digest')"
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' > /tmp/base-manifest.json
          python "$GITHUB_WORKSPACE/tools/runner_images.py" verify-platforms --input /tmp/base-manifest.json
          echo "digest=${candidate_digest}" >> "$GITHUB_OUTPUT"

      - name: Attach signed GitHub build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-base
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Publish immutable base tag only after attestation succeeds
        env:
          CANDIDATE_DIGEST: ${{ steps.manifest.outputs.digest }}
          IMMUTABLE_TAG: ${{ needs.resolve.outputs.base_tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_PREFIX}-base"
          gh attestation verify \
            "oci://${image}@${CANDIDATE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
            --source-ref "$ATTESTATION_SOURCE_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          # Query immediately before publication. Only an authenticated GHCR
          # 404 is treated as absent; auth, network, and server errors fail.
          existing="$(python tools/runner_images.py inspect-ghcr-tag \
            --image "$image" --tag "$IMMUTABLE_TAG")"
          if [[ "$existing" == "absent" ]]; then
            python tools/runner_images.py check-collision \
              --candidate "$CANDIDATE_DIGEST"
            docker buildx imagetools create \
              -t "${image}:${IMMUTABLE_TAG}" \
              "${image}@${CANDIDATE_DIGEST}"
          else
            python tools/runner_images.py check-collision \
              --existing "$existing" --candidate "$CANDIDATE_DIGEST"
          fi
          actual="$(docker buildx imagetools inspect \
            "${image}:${IMMUTABLE_TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$actual" == "$CANDIDATE_DIGEST" ]]

  build-backends:
    name: Build ${{ matrix.name }} (${{ matrix.arch }})
    needs: [guard, resolve, merge-base]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        (
          (needs.resolve.outputs.base_changed == 'true' && needs.merge-base.result == 'success') ||
          (needs.resolve.outputs.base_changed == 'false' && needs.merge-base.result == 'skipped')
        ) &&
        needs.resolve.outputs.builds != '[]'
      }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.builds) }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolved-runner-plan-${{ github.run_attempt }}
          path: /tmp/plan
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Materialize exact build arguments
        id: args
        shell: bash
        run: |
          set -euo pipefail
          backend="${{ matrix.name }}"
          item="$(jq -c --arg backend "$backend" '.backends[$backend]' /tmp/plan/resolved-runner-versions.json)"
          base_digest="${{ needs.merge-base.outputs.digest }}"
          if [[ -z "$base_digest" ]]; then
            base_digest="${{ needs.resolve.outputs.base_digest }}"
          fi
          [[ "$base_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          {
            echo 'value<<HELIX_ARGS'
            echo "BASE_IMAGE=${IMAGE_PREFIX}-base@${base_digest}"
            echo "CLI_VERSION=$(jq -r '.version' <<< "$item")"
            case "$(jq -r '.kind' <<< "$item")" in
              npm)
                echo "CLI_TARBALL=$(jq -r '.tarball' <<< "$item")"
                echo "CLI_SHA512=$(jq -r '.sha512' <<< "$item")"
                echo "CLI_SHARED_TARBALL=$(jq -r '.artifacts.shared[0].tarball // \"\"' <<< "$item")"
                echo "CLI_SHARED_SHA512=$(jq -r '.artifacts.shared[0].sha512 // \"\"' <<< "$item")"
                echo "CLI_AMD64_TARBALL=$(jq -r '.artifacts.amd64[0].tarball' <<< "$item")"
                echo "CLI_AMD64_SHA512=$(jq -r '.artifacts.amd64[0].sha512' <<< "$item")"
                echo "CLI_AMD64_FALLBACK_TARBALL=$(jq -r '.artifacts.amd64[1].tarball // \"\"' <<< "$item")"
                echo "CLI_AMD64_FALLBACK_SHA512=$(jq -r '.artifacts.amd64[1].sha512 // \"\"' <<< "$item")"
                echo "CLI_ARM64_TARBALL=$(jq -r '.artifacts.arm64[0].tarball' <<< "$item")"
                echo "CLI_ARM64_SHA512=$(jq -r '.artifacts.arm64[0].sha512' <<< "$item")"
                ;;
              codex)
                echo "CLI_TARBALL=$(jq -r '.tarball' <<< "$item")"
                echo "CLI_SHA512=$(jq -r '.sha512' <<< "$item")"
                echo "CLI_AMD64_TARBALL=$(jq -r '.platforms.amd64.tarball' <<< "$item")"
                echo "CLI_AMD64_SHA512=$(jq -r '.platforms.amd64.sha512' <<< "$item")"
                echo "CLI_ARM64_TARBALL=$(jq -r '.platforms.arm64.tarball' <<< "$item")"
                echo "CLI_ARM64_SHA512=$(jq -r '.platforms.arm64.sha512' <<< "$item")"
                ;;
              cursor)
                echo "CLI_AMD64_TARBALL=$(jq -r '.platforms.amd64.tarball' <<< "$item")"
                echo "CLI_AMD64_SHA256=$(jq -r '.platforms.amd64.sha256' <<< "$item")"
                echo "CLI_ARM64_TARBALL=$(jq -r '.platforms.arm64.tarball' <<< "$item")"
                echo "CLI_ARM64_SHA256=$(jq -r '.platforms.arm64.sha256' <<< "$item")"
                ;;
              *)
                echo "unknown backend kind" >&2
                exit 2
                ;;
            esac
            echo HELIX_ARGS
          } >> "$GITHUB_OUTPUT"

      - name: Build backend by untagged digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ matrix.platform }}
          build-args: ${{ steps.args.outputs.value }}
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
          outputs: type=image,name=${{ env.IMAGE_PREFIX }}-${{ matrix.name }},push-by-digest=true,name-canonical=true,push=true
          provenance: mode=max
          sbom: true

      - name: Smoke exact architecture digest before any tag exists
        shell: bash
        run: |
          set -euo pipefail
          digest="${{ steps.build.outputs.digest }}"
          image="${IMAGE_PREFIX}-${{ matrix.name }}@${digest}"
          docker pull "$image"
          smoke="$(jq -r '.backends["${{ matrix.name }}"].smoke_command' /tmp/plan/resolved-runner-versions.json)"
          output="$(docker run --rm --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --tmpfs /home/node:rw,nosuid,nodev,uid=1000,gid=1000 \
            --user 1000:1000 "$image" sh -lc "$smoke")"
          version="$(jq -r '.backends["${{ matrix.name }}"].version' /tmp/plan/resolved-runner-versions.json)"
          grep -F "$version" <<< "$output"
          if [[ "${{ matrix.name }}" == codex ]]; then
            docker run --rm --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev \
              --tmpfs /home/node:rw,nosuid,nodev,uid=1000,gid=1000 \
              --user 1000:1000 "$image" \
              codex debug models --bundled > /tmp/codex-models.json
            python tools/runner_images.py verify-codex-catalog --input /tmp/codex-models.json
          fi
          mkdir -p /tmp/smoke-evidence
          jq -n \
            --arg backend "${{ matrix.name }}" \
            --arg platform "${{ matrix.platform }}" \
            --arg digest "$digest" \
            --arg version "$version" \
            '{backend:$backend,platform:$platform,digest:$digest,version:$version}' \
            > "/tmp/smoke-evidence/smoke-${{ matrix.arch }}.json"
          if [[ "${{ matrix.name }}" == codex ]]; then
            cp /tmp/codex-models.json \
              "/tmp/smoke-evidence/codex-models-${{ matrix.arch }}.json"
          fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digests-${{ matrix.name }}-${{ matrix.arch }}-${{ github.run_attempt }}
          path: /tmp/smoke-evidence/
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

  merge-backends:
    name: Validate and publish ${{ matrix.name }} immutable manifest
    needs: [guard, resolve, build-backends]
    if: ${{ needs.resolve.outputs.changed != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.changed) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: /tmp/downloads
          pattern: digests-${{ matrix.name }}-*-${{ github.run_attempt }}
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create candidate and enforce platform parity
        id: manifest
        shell: bash
        run: |
          set -euo pipefail
          python tools/runner_images.py verify-build-evidence \
            --input-dir /tmp/downloads \
            --backend "${{ matrix.name }}" \
            --version "${{ matrix.version }}" \
            --output /tmp/build-evidence.json
          candidate="${IMAGE_PREFIX}-${{ matrix.name }}:candidate-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          mapfile -t digest_refs < <(
            jq -r --arg image "${IMAGE_PREFIX}-${{ matrix.name }}" \
              '.digests[] | $image + "@" + .' /tmp/build-evidence.json
          )
          [[ "${#digest_refs[@]}" -eq 2 ]]
          docker buildx imagetools create -t "$candidate" "${digest_refs[@]}"
          docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' > /tmp/manifest.json
          python tools/runner_images.py verify-platforms --input /tmp/manifest.json
          candidate_digest="$(jq -r '.digest' /tmp/manifest.json)"
          echo "digest=${candidate_digest}" >> "$GITHUB_OUTPUT"

      - name: Attach signed GitHub build provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-name: ${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true

      - name: Publish immutable tag and release record after attestation
        env:
          CANDIDATE_DIGEST: ${{ steps.manifest.outputs.digest }}
          BACKEND: ${{ matrix.name }}
          VERSION: ${{ matrix.version }}
          IMMUTABLE_TAG: ${{ matrix.immutable_tag }}
          PROMOTION_APPROVED: ${{ matrix.promotion_approved }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND" =~ ^(claude|codex|cursor|gemini|opencode)$ ]]
          [[ "$CANDIDATE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_PREFIX}-${BACKEND}"
          gh attestation verify "oci://${image}@${CANDIDATE_DIGEST}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
            --source-ref "$ATTESTATION_SOURCE_REF" \
            --source-digest "$GITHUB_SHA" \
            --deny-self-hosted-runners
          # Keep the collision decision and tag write in this serialized
          # publication step; only an authenticated 404 means absent.
          existing="$(python tools/runner_images.py inspect-ghcr-tag \
            --image "$image" --tag "$IMMUTABLE_TAG")"
          if [[ "$existing" == "absent" ]]; then
            python tools/runner_images.py check-collision \
              --candidate "$CANDIDATE_DIGEST"
            docker buildx imagetools create -t "${image}:${IMMUTABLE_TAG}" \
              "${image}@${CANDIDATE_DIGEST}"
          else
            python tools/runner_images.py check-collision \
              --existing "$existing" --candidate "$CANDIDATE_DIGEST"
          fi
          actual="$(docker buildx imagetools inspect \
            "${image}:${IMMUTABLE_TAG}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$actual" == "$CANDIDATE_DIGEST" ]]
          mkdir -p /tmp/release
          jq -n \
            --arg backend "$BACKEND" \
            --arg version "$VERSION" \
            --arg digest "$CANDIDATE_DIGEST" \
            --arg immutable_tag "$IMMUTABLE_TAG" \
            --argjson promotion_approved "$PROMOTION_APPROVED" \
            '{backend:$backend,version:$version,digest:$digest,immutable_tag:$immutable_tag,promotion_approved:$promotion_approved}' \
            > "/tmp/release/${BACKEND}.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.name }}-${{ github.run_attempt }}
          path: /tmp/release/${{ matrix.name }}.json
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

  promote:
    name: Promote validated convenience tags as one compensated transaction
    needs: [guard, resolve, build-backends, merge-backends]
    if: >-
      ${{
        always() &&
        needs.resolve.result == 'success' &&
        (needs.build-backends.result == 'success' || needs.build-backends.result == 'skipped') &&
        (needs.merge-backends.result == 'success' || needs.merge-backends.result == 'skipped') &&
        (needs.resolve.outputs.changed != '[]' || needs.resolve.outputs.promotions != '[]')
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      attestations: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: ${{ needs.resolve.outputs.changed != '[]' }}
        with:
          pattern: release-*-${{ github.run_attempt }}
          path: /tmp/release
          merge-multiple: true
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Preflight every target and save durable rollback tags
        id: preflight
        env:
          CHANGED_JSON: ${{ needs.resolve.outputs.changed }}
          PROMOTIONS_JSON: ${{ needs.resolve.outputs.promotions }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/promotion
          jq -c '.[]' <<< "$PROMOTIONS_JSON" > /tmp/approved.jsonl
          jq -c '.[] | select(.promotion_approved == true)' \
            <<< "$CHANGED_JSON" >> /tmp/approved.jsonl
          while IFS= read -r planned; do
            [[ -n "$planned" ]] || continue
            backend="$(jq -r '.name' <<< "$planned")"
            [[ "$backend" =~ ^(claude|codex|cursor|gemini|opencode)$ ]]
            release="/tmp/release/${backend}.json"
            if [[ -f "$release" ]]; then
              jq -e --arg backend "$backend" \
                '.backend == $backend and .promotion_approved == true' \
                "$release" >/dev/null
              next="$(jq -r '.digest' "$release")"
              immutable_tag="$(jq -r '.immutable_tag' "$release")"
            else
              next="$(jq -r '.target_digest' <<< "$planned")"
              immutable_tag="$(jq -r '.immutable_tag' <<< "$planned")"
            fi
            [[ "$next" =~ ^sha256:[0-9a-f]{64}$ ]]
            image="${IMAGE_PREFIX}-${backend}"
            docker buildx imagetools inspect "${image}@${next}" \
              --format '{{json .Manifest}}' > "/tmp/${backend}-next.json"
            python tools/runner_images.py verify-platforms \
              --input "/tmp/${backend}-next.json"
            gh attestation verify "oci://${image}@${next}" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
              --source-ref "$ATTESTATION_SOURCE_REF" \
              --deny-self-hosted-runners

            # Automatic promotion requires a recoverable previous target.
            docker buildx imagetools inspect "${image}:latest" \
              --format '{{json .Manifest}}' > "/tmp/${backend}-previous.json"
            python tools/runner_images.py verify-platforms \
              --input "/tmp/${backend}-previous.json"
            previous="$(jq -r '.digest' "/tmp/${backend}-previous.json")"
            [[ "$previous" =~ ^sha256:[0-9a-f]{64}$ ]]
            rollback_tag="rollback-before-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            existing="$(python tools/runner_images.py inspect-ghcr-tag \
              --image "$image" --tag "$rollback_tag")"
            if [[ "$existing" == "absent" ]]; then
              python tools/runner_images.py check-collision \
                --candidate "$previous"
              docker buildx imagetools create -t "${image}:${rollback_tag}" \
                "${image}@${previous}"
            else
              python tools/runner_images.py check-collision \
                --existing "$existing" --candidate "$previous"
            fi
            actual_rollback="$(docker buildx imagetools inspect \
              "${image}:${rollback_tag}" \
              --format '{{json .Manifest}}' | jq -r '.digest')"
            [[ "$actual_rollback" == "$previous" ]]
            jq -n \
              --arg backend "$backend" \
              --arg previous_digest "$previous" \
              --arg promoted_digest "$next" \
              --arg immutable_tag "$immutable_tag" \
              --arg rollback_tag "$rollback_tag" \
              --arg run_id "$GITHUB_RUN_ID" \
              --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
              '{state:"prepared",backend:$backend,previous_digest:$previous_digest,promoted_digest:$promoted_digest,immutable_tag:$immutable_tag,rollback_tag:$rollback_tag,run_id:$run_id,run_attempt:$run_attempt}' \
              > "/tmp/promotion/${backend}.json"
          done < /tmp/approved.jsonl
          if compgen -G '/tmp/promotion/*.json' >/dev/null; then
            echo "prepared=true" >> "$GITHUB_OUTPUT"
          else
            echo "prepared=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Retain promotion rollback plan before moving latest tags
        if: ${{ steps.preflight.outputs.prepared == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: promotion-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/promotion/
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

      - name: Move latest tags with compensating rollback on any failure
        id: move
        shell: bash
        run: |
          set -euo pipefail
          exec python tools/runner_images.py promote-latest \
            --input-dir /tmp/promotion \
            --ledger-dir /tmp/rollback-ledger \
            --moved-file /tmp/moved-backends \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain committed promotion ledger
        id: committed_ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ steps.move.outputs.promoted == 'true' }}
        with:
          name: rollback-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/rollback-ledger/
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

      - name: Restore latest tags if committed ledger retention fails
        if: >-
          ${{
            failure() &&
            steps.move.outputs.promoted == 'true' &&
            steps.committed_ledger.outcome == 'failure'
          }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/runner_images.py restore-latest \
            --input-dir /tmp/promotion
          echo "Committed ledger retention failed; latest tags were restored." >&2
          exit 1

  rollback-verify:
    name: Verify rollback target (${{ matrix.arch }})
    needs: guard
    if: >-
      ${{
        needs.guard.result == 'success' &&
        github.event_name == 'workflow_dispatch' &&
        inputs.operation == 'rollback'
      }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Validate and smoke the exact rollback digest
        env:
          BACKEND: ${{ inputs.backend }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND" =~ ^(claude|codex|cursor|gemini|opencode)$ ]]
          [[ "$TARGET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_PREFIX}-${BACKEND}@${TARGET_DIGEST}"
          docker pull --platform "${{ matrix.platform }}" "$image"
          smoke="$(jq -r --arg backend "$BACKEND" \
            '.backends[$backend].smoke_command' "$CATALOG")"
          docker run --rm --platform "${{ matrix.platform }}" --network none --read-only \
            --tmpfs /tmp:rw,nosuid,nodev \
            --tmpfs /home/node:rw,nosuid,nodev,uid=1000,gid=1000 \
            --user 1000:1000 "$image" sh -lc "$smoke"
          if [[ "$BACKEND" == codex ]]; then
            docker run --rm --platform "${{ matrix.platform }}" --network none --read-only \
              --tmpfs /tmp:rw,nosuid,nodev \
              --tmpfs /home/node:rw,nosuid,nodev,uid=1000,gid=1000 \
              --user 1000:1000 "$image" codex debug models --bundled > /tmp/codex-models.json
            python tools/runner_images.py verify-codex-catalog --input /tmp/codex-models.json
          fi

  rollback-promote:
    name: Roll back convenience tag
    needs: [guard, rollback-verify]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Prepare manual rollback transaction
        id: rollback_preflight
        env:
          BACKEND: ${{ inputs.backend }}
          TARGET_DIGEST: ${{ inputs.target_digest }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$BACKEND" =~ ^(claude|codex|cursor|gemini|opencode)$ ]]
          [[ "$TARGET_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          image="${IMAGE_PREFIX}-${BACKEND}"
          target="$TARGET_DIGEST"
          docker buildx imagetools inspect "${image}@${target}" --format '{{json .Manifest}}' > /tmp/manifest.json
          python tools/runner_images.py verify-platforms --input /tmp/manifest.json
          gh attestation verify "oci://${image}@${target}" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$ATTESTATION_SIGNER_WORKFLOW" \
            --source-ref "$ATTESTATION_SOURCE_REF" \
            --deny-self-hosted-runners
          previous="$(docker buildx imagetools inspect "${image}:latest" --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$previous" =~ ^sha256:[0-9a-f]{64}$ ]]
          rollback_tag="rollback-before-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          existing="$(python tools/runner_images.py inspect-ghcr-tag \
            --image "$image" --tag "$rollback_tag")"
          if [[ "$existing" == "absent" ]]; then
            python tools/runner_images.py check-collision \
              --candidate "$previous"
            docker buildx imagetools create -t "${image}:${rollback_tag}" \
              "${image}@${previous}"
          else
            python tools/runner_images.py check-collision \
              --existing "$existing" --candidate "$previous"
          fi
          actual_rollback="$(docker buildx imagetools inspect \
            "${image}:${rollback_tag}" \
            --format '{{json .Manifest}}' | jq -r '.digest')"
          [[ "$actual_rollback" == "$previous" ]]
          mkdir -p /tmp/manual-promotion
          jq -n \
            --arg backend "$BACKEND" \
            --arg previous_digest "$previous" \
            --arg promoted_digest "$target" \
            --arg rollback_tag "$rollback_tag" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg run_attempt "$GITHUB_RUN_ATTEMPT" \
            '{operation:"rollback",state:"prepared",backend:$backend,previous_digest:$previous_digest,promoted_digest:$promoted_digest,rollback_tag:$rollback_tag,run_id:$run_id,run_attempt:$run_attempt}' \
            > "/tmp/manual-promotion/${BACKEND}.json"
          echo "previous_digest=${previous}" >> "$GITHUB_OUTPUT"
          echo "target_digest=${target}" >> "$GITHUB_OUTPUT"
          echo "rollback_tag=${rollback_tag}" >> "$GITHUB_OUTPUT"

      - name: Retain manual rollback plan before moving latest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: rollback-plan-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/manual-promotion/
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

      - name: Move latest to the verified rollback digest
        id: rollback_move
        shell: bash
        run: |
          set -euo pipefail
          exec python tools/runner_images.py promote-latest \
            --input-dir /tmp/manual-promotion \
            --ledger-dir /tmp/manual-ledger \
            --moved-file /tmp/manual-moved-backends \
            --github-output "$GITHUB_OUTPUT"

      - name: Retain committed manual rollback ledger
        id: rollback_committed_ledger
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: ${{ steps.rollback_move.outputs.promoted == 'true' }}
        with:
          name: rollback-ledger-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/manual-ledger/
          if-no-files-found: error
          retention-days: ${{ fromJSON(env.EVIDENCE_RETENTION_DAYS) }}

      - name: Restore latest if manual rollback ledger retention fails
        if: >-
          ${{
            failure() &&
            steps.rollback_move.outputs.promoted == 'true' &&
            steps.rollback_committed_ledger.outcome == 'failure'
          }}
        shell: bash
        run: |
          set -euo pipefail
          python tools/runner_images.py restore-latest \
            --input-dir /tmp/manual-promotion
          echo "Committed rollback ledger retention failed; latest was restored." >&2
          exit 1

  notify-failure:
    name: Notify maintainers on refresh failure
    if: ${{ always() && needs.guard.result == 'success' && failure() }}
    needs:
      - guard
      - resolve
      - build-base
      - merge-base
      - build-backends
      - merge-backends
      - promote
      - rollback-verify
      - rollback-promote
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7
        with:
          script: |
            const title = "Automated runner image refresh failed";
            const body = [
              `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              `Event: ${context.eventName}`,
              "No mutable tag is promoted until its digest and both architectures pass validation."
            ].join("\n");
            const {data: issues} = await github.rest.issues.listForRepo({
              ...context.repo, state: "open", per_page: 100
            });
            const issue = issues.find(item => item.title === title && !item.pull_request);
            if (issue) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number, body
              });
            } else {
              await github.rest.issues.create({...context.repo, title, body});
            }
